<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=devicd-width,intial scale=1.0">
<title>DOCUMENT</title>
<style>
    .wrapper{
        display: grid;
        grid-template-columns:200px,200px,200px;    
    }
    *{
        box-sizing:border-box;
    }
      .wrapper>div{
         border:2px solid black;
         border-radius:6px;
         border-color:blueviolet
      }

</style>
</head>
<body>
   <div class="wrapper">
    <div>one</div>
    <div>two</div>
    <div>three</div>
    <div>four</div>
    <div>five</div>
   </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flipkart App Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f1f3f6;
    }

    /* Header */
    header {
      background-color: #2874f0;
      color: white;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .search-box input {
      width: 300px;
      padding: 8px;
      border: none;
      border-radius: 4px;
    }

    /* Categories */
    .categories {
      background: white;
      padding: 15px;
      display: flex;
      justify-content: space-around;
      font-weight: bold;
    }

    /* Products */
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .product-card {
      background: white;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .product-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
    }

    .product-card h3 {
      font-size: 16px;
      margin: 10px 0;
    }

    .price {
      color: green;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .product-card button {
      background: #ff9f00;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .product-card button:hover {
      background: #fb641b;
      color: white;
    }

    /* Footer */
    footer {
      background: #172337;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Flipkart</div>
  <div class="search-box">
    <input type="text" placeholder="Search for products">
  </div>
</header>

<div class="categories">
  <div>Mobiles</div>
  <div>Fashion</div>
  <div>Electronics</div>
  <div>Home</div>
  <div>Appliances</div>
</div>

<section class="products">
  <div class="product-card">
    <img src="https://via.placeholder.com/200" alt="Product">
    <h3>Smartphone</h3>
    <p class="price">₹14,999</p>
    <button>Add to Cart</button>
  </div>

  <div class="product-card">
    <img src="https://via.placeholder.com/200" alt="Product">
    <h3>Headphones</h3>
    <p class="price">₹1,999</p>
    <button>Add to Cart</button>
  </div>

  <div class="product-card">
    <img src="https://via.placeholder.com/200" alt="Product">
    <h3>Running Shoes</h3>
    <p class="price">₹2,499</p>
    <button>Add to Cart</button>
  </div>

  <div class="product-card">
    <img src="https://via.placeholder.com/200" alt="Product">
    <h3>Laptop</h3>
    <p class="price">₹54,999</p>
    <button>Add to Cart</button>
  </div>
</section>

<footer>
  © 2026 Flipkart Clone | For Educational Use Only
</footer>

</body>
</html>
